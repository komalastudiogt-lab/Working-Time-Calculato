name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar esto manualmente si lo deseas

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (JDK 17 para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar Capacitor e inyectar código
        run: |
          # 1. Crear carpeta para el código web
          mkdir www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          
          # 2. Iniciar proyecto y descargar Capacitor
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # 3. Configurar la app nativa
          npx cap init "Working Time" "com.workingtime.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar el APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: WorkingTime-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
