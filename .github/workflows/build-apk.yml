name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Preparar Capacitor e inyectar plugins
        run: |
          mkdir www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          
          npm init -y
          # 1. Instalamos los plugins nativos
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest @capacitor/filesystem@latest @capacitor/share@latest
          
          # 2. Extraemos los scripts nativos
          cp node_modules/@capacitor/core/dist/capacitor.js www/js/
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/js/capacitor-filesystem.js
          cp node_modules/@capacitor/share/dist/plugin.js www/js/capacitor-share.js
          
          # 3. Los inyectamos en tu index.html silenciosamente
          sed -i 's|<script src="./js/app.js"></script>|<script src="./js/capacitor.js"></script><script src="./js/capacitor-filesystem.js"></script><script src="./js/capacitor-share.js"></script><script src="./js/app.js"></script>|g' www/index.html
          
          npx cap init "Working Time" "com.workingtime.app" --web-dir www
          npx cap add android
          
          mkdir assets
          if [ -f "icon.png" ]; then
            mv icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: Compilar el APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: WorkingTime-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
